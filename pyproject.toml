[project]
name = "shop-assistant"
version = "0.1.0"
description = "AI Shop Assistant"
readme = "README.md"
authors = [
    { name = "Refone Leo", email = "710196926@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "flagembedding>=1.4.2",
    "grandalf>=0.8",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.4",
    "langchain-openai>=1.6.4",
    "langgraph>=1.2.12",
    "loguru>=0.7.3",
    "mineru>=4.0.6",
    "minio>=7.2.20",
    "modelscope>=1.40.1",
    "numpy>=2.5.3",
    "openai-agents>=0.20.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymilvus>=3.0.2",
    "pymongo>=4.18.1",
    "python-dotenv>=1.2.3",
    "regex>=2026.9.10",
    "requests>=2.34.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
# pytest 最低版本声明
minversion = "9.0"
# 只收集 test/ 下的用例
testpaths = ["test"]
# src 是源码根, 让 `import utils.xxx` / `import processor.xxx` 直接可用 (无需安装包)
pythonpath = ["src"]
# 测试文件命名约定: 与 src 模块同名 + _test.py 后缀, 便于镜像对照
python_files = ["*_test.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # 不把测试目录塞进 sys.path, 避免同名模块互相覆盖
    "--import-mode=importlib",
    # 指定要测量覆盖率的源代码路径
    "--cov=src",
    # 在 reports/coverage_html 下生成覆盖率报告
    "--cov-report=html:reports/coverage_html",
    # 在 reports/coverage_xml 下生成 xml 覆盖率报告
    "--cov-report=xml:reports/coverage_xml",
]
markers = [
    "unit: 单元测试 (mock 所有外部依赖, 默认运行)",
    "smoke: 冒烟测试 (真实 apikey / 网络请求), 默认跳过, 用 --run-smoke 开启",
    "integration: 模块耦合集成测试 (依赖 Milvus / MinIO / LLM 等), 默认跳过, 用 --run-integration 开启",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.coverage.run]
# 跑覆盖率测试会自动生成一个 .coverage 文件, 这里指定其路径
data_file = "reports/.coverage"
