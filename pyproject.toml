[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shop-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Refone Leo", email = "710196926@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "flagembedding>=1.4.2",
    "grandalf>=0.8",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.4",
    "langgraph>=1.2.12",
    "loguru>=0.7.3",
    "mineru>=4.0.6",
    "minio>=7.2.20",
    "modelscope>=1.40.1",
    "numpy>=2.5.3",
    "openai-agents>=0.20.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymilvus>=3.0.2",
    "pymongo>=4.18.1",
    "python-dotenv>=1.2.3",
    "regex>=2026.9.10",
    "requests>=2.34.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn>=0.53.0",
]

# src 布局: 将 src 下的各包以顶层包名(utils、common、processor...)暴露,
# 通过 `uv sync` 以 editable 方式安装后, 任意入口直接运行脚本也能正确导入
[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/common", "src/processor", "src/test", "src/utils"]
