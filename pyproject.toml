[project]
name = "shop-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Refone Leo", email = "710196926@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "grandalf>=0.8",
    "langchain-openai>=1.6.3",
    "langgraph>=1.2.12",
    "mineru[all]>=4.0.6",
    "minio>=7.2.20",
    "openai-agents>=0.20.0",
    "pymilvus[model]>=3.0.2",
    "pymongo>=4.18.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
shop-assistant = "shop_assistant:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
