# Markdown Splitter

这份文档演示 `src/utils/markdown_splitter.py` 中 `split_markdown()` 的切分结果。
切分以标题为单位：遇到新的标题时，之前积累的内容会作为一个 `Chunk` 结束。

每个 `Chunk` 都携带三项数据：

- `content` — 该块包含的 Markdown 正文。
- `level` — 所属标题的层级（`#` 为 1，`##` 为 2，依此类推；正文前的引言为 0）。
- `title_stack` — 所属章节的标题路径（面包屑）。

## 切分原理

文档按行扫描，标题行会开启一个新的块，代码块整体保留、不会从中间切开。

### 标题栈

- 每个 Chunk 记录它所在的标题栈，例如 `["Markdown Splitter", "切分原理"]`。
- `level` 与 `title_stack` 的长度保持一致，便于还原文档结构。

### 代码块

代码块中的 `#` 不会触发切分：

```python
def split_markdown(md_content: str, max_chunk_size: int, overlap_size: int):
    return markdown_split_by_title(md_content)
```

## 查看方式

- **origin** — 渲染整篇 Markdown。
- **split** — 以卡片展示每个 Chunk 的正文与切分边界。
- **meta** — 以 JSON 格式展示每个 Chunk 的 `content` / `level` / `title_stack`。

调整顶部的 `max chunk` 与 `overlap` 参数，观察切分结果的变化。

import copy
import re
from typing import TypedDict

class Chunk(TypedDict):
    content: str
    level: int
    title_stack: list[str]

_TITLE_RE = re.compile(r"^(#{1,6})\s+(.*)$")
_CODE_RE = re.compile(r'^[ \t]{0,3}(`{3,}|~{3,})')

def markdown_split_by_title(
    md_content:str,
    ) -> list[Chunk]:
    chunk_list = []

    md_lines = md_content.splitlines()  # 将内容按行分割
    current_title:list[str] = []
    current_level = 0
    current_content_lines:list[str] = []
    is_code = False

    for line_num, line in enumerate(md_lines):
        # 跳过空行
        if not line.strip():
            # 为不破坏 md 结构，仍然把空行加入 current_content_lines
            current_content_lines.append(line)
            continue

        # 代码行不分块，整块吞下
        if _CODE_RE.match(line):
            is_code = not is_code
            current_content_lines.append(line)
            continue

        if is_code:
            current_content_lines.append(line)
            continue

        # 判断当前行是正文还是标题
        if _TITLE_RE.match(line):
        # 当前行是标题
            if current_content_lines:
                # 之前 content 中有内容，这是一个新块的开始
                # 处理之前的 block
                last_content = "\n".join(current_content_lines).strip()
                last_level = current_level
                last_chunk = Chunk(
                    content=last_content,
                    level=last_level,
                    title_stack=copy.deepcopy(current_title),
                )
                if last_content:  # 只有当内容不为空时才加入 chunk_list
                    chunk_list.append(last_chunk)
            # 重置当前的状态
            current_level = len(_TITLE_RE.match(line).group(1))
            current_content_lines.clear()
            # current_content_lines.append(line)  # 把标题本身也加入到当前内容中
            current_title[max(current_level-1,0):] = [_TITLE_RE.match(line).group(2)]
            continue

        else:
        # 当前行是正文
            current_content_lines.append(line)

    if current_content_lines:
        last_content = "\n".join(current_content_lines).strip()
        last_level = current_level
        last_chunk = Chunk(
            content=last_content,
            level=last_level,
            title_stack=copy.deepcopy(current_title),
        )
        if last_content:  # 只有当内容不为空时才加入 chunk_list
            chunk_list.append(last_chunk)

    return chunk_list

def split_markdown(md_content: str,
                   max_chunk_size: int,
                   overlap_size: int,
                   ) -> list[Chunk]:
    final_chunks = []
    chunk_list = markdown_split_by_title(md_content)

    return chunk_list
</script>
